version: "3.8"

services:
  yingyou-workshop:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yingyou-workshop
    ports:
      - "5173:5173"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5173/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
